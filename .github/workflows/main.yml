name: Build NightMare APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "characters.js"
      - "audio.js"
      - "props.js"
      - "products.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one module script, found {len(scripts)}")
          Path("/tmp/nightmare-index.mjs").write_text(scripts[0], encoding="utf-8")
          for name in ("characters.js", "audio.js", "props.js", "products.js"):
              Path("/tmp/" + name.replace(".js", ".mjs")).write_text(Path(name).read_text(encoding="utf-8"), encoding="utf-8")
          PY
          node --check /tmp/nightmare-index.mjs
          node --check /tmp/characters.mjs
          node --check /tmp/audio.mjs
          node --check /tmp/props.mjs
          node --check /tmp/products.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare web game
        run: |
          mkdir -p www
          cp index.html characters.js audio.js props.js products.js www/
          cp node_modules/three/build/three.module.js www/three.module.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightMare-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
